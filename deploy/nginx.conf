map $http_upgrade $workbench_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $workbench_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $http_host $workbench_forwarded_host {
    default $http_host;
    '' $host;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    access_log off;
    client_max_body_size 21m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $workbench_forwarded_host;
        proxy_set_header X-Forwarded-Host $workbench_forwarded_host;
        proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $workbench_connection_upgrade;
        proxy_set_header Host $workbench_forwarded_host;
        proxy_set_header X-Forwarded-Host $workbench_forwarded_host;
        proxy_set_header X-Forwarded-Proto $workbench_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
